name: Flutter CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android .
      - name: Render Rasmati SVG brand assets
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/branding/rasmati_icon.svg > assets/branding/rasmati_icon.png
          rsvg-convert -w 1024 -h 1024 assets/branding/rasmati_foreground.svg > assets/branding/rasmati_foreground.png
      - run: flutter pub get
      - name: Prepare offline AI model assets
        run: bash tool/prepare_ai_assets.sh
      - run: dart run flutter_launcher_icons
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: rasmati-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
