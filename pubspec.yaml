name: rasmati
description: Rasmati turns children's paper drawings into playful animations.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  image: ^4.5.4
  path_provider: ^2.1.5
  flutter_animated_drawings:
    git:
      url: https://github.com/konyshevgmbh/animated_drawings_flutter.git
      ref: f906a50f0fc2c227ff77ba1550c711fa8e73431e

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # The AI package expects these assets at app-root paths; tool/prepare_ai_assets.sh
  # stages the pinned open-source model/configs before a local or CI build.
  assets:
    - assets/sample.png
    - assets/models/
    - assets/bvh/cmu1/
    - assets/bvh/fair1/
    - assets/bvh/rokoko/
    - assets/config/motion/
    - assets/config/retarget/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/rasmati_icon.png
  adaptive_icon_background: "#7558E8"
  adaptive_icon_foreground: assets/branding/rasmati_foreground.png
  remove_alpha_ios: true
